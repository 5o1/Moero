model:
  class_path: plm.models.Cmr25Module
  init_args:
    optimizer_init_kwargs:
      lr: 0.0002
      weight_decay: 1e-2

    model:
      class_path: models.modl.MoDL
      init_args:
        in_channels: 2
        out_channels: 2
        num_layers: 8
        csmblock_kwargs:
          crop: true

        csm_model:
          class_path: models.backbones.Unet
          init_args:
            in_channels: 2
            out_channels: 2
            pyramid_channels: [4, 8, 12, 16]
            n_enc_cab: [2, 3, 3]
            n_dec_cab: [2, 2, 3]
            n_skip_cab: [1, 1, 1, 3]
            reduction: 1
            norm: false
            bias: false
            idx_cascade: null

        