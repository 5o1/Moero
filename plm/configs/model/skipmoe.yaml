model:
  class_path: plm.models.Cmr25Module
  init_args:
    ckpt_path: /home/liyuyang/exp/moero/expxa98k/checkpoints/last.ckpt
    ckpt_strict: false
    optimizer_init_kwargs:
      lr: 0.0002
      weight_decay: 1e-2

    model:
      class_path: models.moero_gg.MoeroGG
      init_args:
        csmblock_kwargs:
          crop: true

        csm_model:
          class_path: models.backbones.PromptUnet
          init_args:
            in_channels: 10
            out_channels: 10
            pyramid_channels: [8, 12, 16, 20]
            prompt_tokens: [8, 8, 8]
            prompt_channels: [6, 8, 10]
            prompt_figsize: [64, 32, 16]
            n_enc_cab: [2, 3, 3]
            n_dec_cab: [2, 2, 3]
            n_skip_cab: [1, 1, 1, 3]
            reduction: 1
            norm: false
            bias: false
            idx_cascade: null

        cascades: 
          - class_path: models.backbones.moeskipunet.MoeSkipUnet
            init_args: &cascadebase
              in_channels: 50
              out_channels: 50
              pyramid_channels: [32, 48, 64, 80]
              prompt_tokens: [8, 8, 8]
              prompt_channels: [24, 32, 40]
              prompt_figsize: [64, 32, 16]
              n_enc_cab: [2, 3, 3]
              n_dec_cab: [2, 2, 3]
              n_skip_cab: [1, 1, 1, 3]
              reduction: 1
              moe_top_k: 2
              moe_poolsize: 8
              gate_class_path: models.modules.nav.SkipRouter
              gate_init_args:
                embedding_channels: 1024
                n_cab: 2
                cluster: "linear"
                prototype_update_interval: null
                batch_cache_size: 50
                balance_prior_lambda: 0.0
                z_loss_coef: 1e-2
                aux_loss_coef: 0
                aux_loss_batch_coef: 1
                prob_sparse_loss_coef: 5e-2
                # aux loss decay settings
                aux_loss_coef_min: 0
                aux_loss_batch_coef_min: 10
                aux_loss_decay_type: linear
                aux_loss_step0: 10000
                aux_loss_stepn: 50000
                detach: true
                n_skip: 0
                sync_until_step: 0
                # temperature decay settings
                temp_init:  1.0        # large temperature for near-uniform at early stage
                temp_min:  1.0         # small temperature for sharp distribution at later stage
                temp_decay_type: exp
                temp_decay_steps: 10000 # for linear/cosine
                temp_gamma: 0.9995    # for exp: tau_t = max(temp_min, temp_init * gamma^t)
              # decoder_expand: 6
              norm: false
              bias: false
              idx_cascade: 0
          - class_path: models.backbones.moeskipunet.MoeSkipUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 1
          - class_path: models.backbones.moeskipunet.MoeSkipUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 2
          - class_path: models.backbones.moeskipunet.MoeSkipUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 3
          - class_path: models.backbones.moeskipunet.MoeSkipUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 4
          - class_path: models.backbones.moeskipunet.MoeSkipUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 5
