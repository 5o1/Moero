model:
  class_path: plm.models.Cmr25Module
  init_args:

    optimizer_init_kwargs:
      lr: 0.0002
      weight_decay: 1e-2

    model:
      class_path: models.PromptMRp
      init_args:
        senseblock_kwargs:
          use_noise: true
        csmblock_kwargs:
          crop: true

        csm_model:
          class_path: models.backbones.PromptUnet
          init_args:
            in_channels: 10
            out_channels: 10
            pyramid_channels: [8, 12, 16, 20]
            prompt_tokens: [8, 8, 8]
            prompt_channels: [6, 8, 10]
            prompt_figsize: [64, 32, 16]
            n_enc_cab: [2, 3, 3]
            n_dec_cab: [2, 2, 3]
            n_skip_cab: [1, 1, 1, 3]
            reduction: 1
            norm: false
            bias: false
            idx_cascade: null
            
        cascades: 
          - class_path: models.backbones.PromptUnet
            init_args: &cascadebase
              in_channels: 50
              out_channels: 50
              pyramid_channels: [32, 48, 64, 80]
              prompt_tokens: [8, 8, 8]
              prompt_channels: [24, 32, 40]
              prompt_figsize: [64, 32, 16]
              n_enc_cab: [2, 3, 3]
              n_dec_cab: [2, 2, 3]
              n_skip_cab: [1, 1, 1, 3]
              reduction: 1
              n_history: 0
              use_history: false
              norm: false
              bias: false
              history_norm: null
              idx_cascade: 0
          - class_path: models.backbones.PromptUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 1
          - class_path: models.backbones.PromptUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 2
          - class_path: models.backbones.PromptUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 3
          - class_path: models.backbones.PromptUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 4
          - class_path: models.backbones.PromptUnet
            init_args:
              <<: *cascadebase
              idx_cascade: 5