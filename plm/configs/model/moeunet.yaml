model:
  class_path: plm.models.Cmr25Module
  init_args:
    optimizer_init_kwargs:
      lr: 0.0002
      weight_decay: 1e-2

    model:
      class_path: models.moero_gg.MoeroGG
      init_args:
        csmblock_kwargs:
          crop: true

        csm_model:
          class_path: models.backbones.Unet
          init_args:
            in_channels: 2
            out_channels: 2
            pyramid_channels: [4, 8, 12, 16]
            n_enc_cab: [2, 2, 2]
            n_dec_cab: [2, 2, 2]
            n_skip_cab: [1, 1, 1, 2]
            reduction: 1
            norm: false
            bias: false
            idx_cascade: null

        cascades: 
          - class_path: models.backbones.lvdown.Lvdown
            init_args: &cascadebase
              in_channels: 8
              out_channels: 8
              pyramid_channels: [8, 16, 24, 32]
              n_enc_cab: [2, 2, 2]
              n_dec_cab: [2, 2, 2]
              n_skip_cab: [1, 1, 1, 2]
              reduction: 1
              moe_top_k: 2
              moe_poolsize: 4
              gate_class_path: models.modules.nav.FeatExtractBranchNav
              gate_init_args:
                pyramid_channels: [32, 64, 128, 256]
                embedding_channels: 1024
                batch_cache_size: 20
                cluster: "prototype"
                balance: "auxloss"
                balance_lambda: 1.0
                aux_loss_coef: 1e-1
                aux_loss_batch_coef: 1e-1
                prob_sparse_loss_coef: 1e-3
                detach: true
                n_skip: 3000
                temp_init:  1        # large temperature for near-uniform at early stage
                temp_decay_type: exp
                temp_decay_steps: 10000 # for linear/cosine
                temp_gamma: 0.9995    # for exp: tau_t = max(temp_min, temp_init * gamma^t)
              # decoder_expand: 6
              norm: false
              bias: false
              idx_cascade: 0
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 1
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 2
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 3
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 4
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 5
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 6
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 7
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 8
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 9
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 10
          - class_path: models.backbones.lvdown.Lvdown
            init_args:
              <<: *cascadebase
              idx_cascade: 11