seed_everything: 42
trainer:
  accelerator: gpu
  precision: 32
  devices: [0]
  check_val_every_n_epoch: 4
  num_nodes: 1
  max_epochs: 48
  log_every_n_steps: 50 # log every n steps during training
  deterministic: false
  use_distributed_sampler: false # Use false because custom VolumeSamplers have been used
  logger: 
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: moero
      mode: online
      save_dir: /home/lyy/exp
      tags: [moeunet, c12, brainknee]
      name: brainknee-1/1-val
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val0/loss
        mode: min 
        save_top_k: 1 # -1 to save all checkpoints, 5 to save the top 5 checkpoints
        save_last: True # always save the last checkpoint
    - class_path: plm.callbacks.progbar.MultiColumnRichProgressBar # Configure this term in plm/callbacks/progbar.py
    - class_path: plm.callbacks.MatmulPrecisionCallback
      init_args:
        precision: "high"  # Set to "high" for high precision matmul operations
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: plm.callbacks.CmrWriter
      init_args:
        output_dir: /home/lyy/moero/temp
        save_zf: true
        save_csm: true
        save_target: true
        save_mask: true
        save_masked_kspace: true
    # - class_path: plm.callbacks.FlopsProfiler
    #   init_args:
    #     inputs_mapper:
    #       class_path: plm.callbacks.flops.CmrInputsMapper
    #       init_args:
    #         keys: ["masked_kspace", "mask"]

ckpt_path: /home/lyy/exp/moero/cqmf1adb/checkpoints/last.ckpt
