data:
  class_path: plm.datasets.CmrDataModule
  init_args:
    num_workers: 8

    train_config:
      path: /home/liyuyang/datasets/fastmri-mini/knee-train
      dataset_class: &datasetclasspath datasets.CmrDatasetBase
      dataset_init_args: &traininitargs
        n_adj_frame: 5
        n_adj_slice: 1
        adj_dim: frame  # Options: "frame", "slice"
        transform: 
          class_path: datasets.Cmr25TrainingTransform
          init_args: {
            acc_factors: [4, 6, 8, 10, 12],
            n_calibs: [20],
          }

    val_configs:

      - path: /home/liyuyang/datasets/fastmri-mini/knee-val
        dataset_class: *datasetclasspath
        dataset_init_args:
          <<: *traininitargs
          transform: 
            class_path: datasets.Cmr25TrainingTransform
            init_args: {
              acc_factors: [4],
              n_calibs: [20],
            }

      - path: /home/liyuyang/datasets/fastmri-mini/knee-val
        dataset_class: *datasetclasspath
        dataset_init_args:
          <<: *traininitargs
          transform: 
            class_path: datasets.Cmr25TrainingTransform
            init_args: {
              acc_factors: [8],
              n_calibs: [20],
            }

      - path: /home/liyuyang/datasets/fastmri-mini/knee-val
        dataset_class: *datasetclasspath
        dataset_init_args:
          <<: *traininitargs
          transform: 
            class_path: datasets.Cmr25TrainingTransform
            init_args: {
              acc_factors: [12],
              n_calibs: [20],
            }
