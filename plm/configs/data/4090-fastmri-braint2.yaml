data:
  class_path: plm.datasets.CmrDataModule
  init_args:
    num_workers: 8

    train_config:
      path: /home/lyy/dataset/braint2/train
      dataset_class: &datasetclasspath datasets.CmrDatasetBase
      dataset_init_args: &traininitargs
        n_adj_frame: 1
        n_adj_slice: 1
        adj_dim: slice  # Options: "frame", "slice"
        transform: 
          class_path: datasets.Cmr25TrainingTransform
          init_args: {
            acc_factors: [4],
            n_calibs: [20],
            mask_weights: {
                Uniform: 1,
                ktGaussian: 0,
                ktRadial: 0,
            }
          }

    val_configs:

      - path: /home/lyy/dataset/braint2/val
        dataset_class: *datasetclasspath
        dataset_init_args:
          <<: *traininitargs
          transform: 
            class_path: datasets.Cmr25TrainingTransform
            init_args: {
              acc_factors: [4],
              n_calibs: [20],
              mask_weights: {
                  Uniform: 1,
                  ktGaussian: 0,
                  ktRadial: 0,
              }
            }
